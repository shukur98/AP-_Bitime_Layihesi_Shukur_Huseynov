# The Java Gauge runner compiles src/test/java and needs its dependencies.
# scripts/run-gauge.sh stages Maven TEST-scope dependencies into libs/* first.
gauge_additional_libs = libs/*
gauge_custom_compile_dir = src/test/java
gauge_custom_build_path = target/test-classes
# A single Gauge JVM caches tokens across steps (do not login before each step).
gauge_clear_state_level = scenario
